name: Build APK

on:
  push:
    branches:
      - rewrite
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Prepare local.properties and secrets.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SIGNING_STORE_PASSWORD=dummy" >> local.properties
          echo "SIGNING_KEY_ALIAS=dummy" >> local.properties
          echo "SIGNING_KEY_PASSWORD=dummy" >> local.properties
          echo "CURRENT_DATE=$(date +%Y%m%d)" >> local.properties
          touch secrets.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mastodon/build/outputs/apk/debug/*.apk

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            mastodon/build/reports/
